<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Our Little Star</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Floating decorations -->
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
    <span class="sparkle s1">✦</span><span class="sparkle s2">✧</span><span class="sparkle s3">✦</span>
    <span class="sparkle s4">♡</span><span class="sparkle s5">✧</span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-ghost music-btn" id="btnMusic" hidden>🎵</button>
    <button class="btn btn-ghost" id="btnLang" data-i18n-title="langToggle">🌐 <span data-i18n="langToggle"></span></button>
    <button class="btn btn-primary" id="btnReview" hidden></button>
    <button class="btn btn-ghost" id="btnShare" data-i18n-title="shareBtn" hidden>📷 <span data-i18n="shareBtn"></span></button>
    <button class="btn btn-ghost" id="btnFamily" data-i18n-title="familyBtn" hidden>👨‍👩‍👧 <span data-i18n="familyBtn"></span></button>
    <button class="btn btn-ghost" id="btnBulk" data-i18n-title="bulkBtn" hidden>🖼️ <span data-i18n="bulkBtn"></span></button>
    <button class="btn btn-ghost" id="btnSettings" data-i18n-title="settings" hidden>⚙️ <span data-i18n="settings"></span></button>
    <button class="btn btn-ghost" id="btnBackup" data-i18n-title="backup" hidden>💾 <span data-i18n="backup"></span></button>
    <button class="btn btn-ghost" id="btnSignOut" data-i18n-title="signOut" hidden>👋 <span data-i18n="signOut"></span></button>
    <button class="btn btn-primary" id="btnEditMode" hidden></button>
  </div>

  <div class="music-panel" id="musicPanel" hidden></div>

  <!-- Shown instead of everything else to anyone who isn't signed in -->
  <section class="gate" id="gate" hidden>
    <div class="gate-card">
      <div class="gate-emoji">🔐</div>
      <h1 data-i18n="gateTitle"></h1>
      <p class="muted" id="gateText"></p>
      <div class="gate-actions">
        <button class="btn btn-primary" id="btnGateLogin" data-i18n="gateSignIn"></button>
        <button class="btn btn-ghost" id="btnGateSignOut" hidden data-i18n="gateOther"></button>
      </div>
    </div>
  </section>

  <div id="app" hidden>
    <header class="hero" id="hero">
      <div class="hero-avatar" id="heroAvatar"></div>
      <button class="btn btn-ghost small-btn hero-edit" id="btnHeroEdit" hidden data-i18n="editProfile"></button>
      <h1 id="heroName"></h1>
      <p class="hero-tagline" id="heroTagline"></p>
      <p class="hero-age" id="heroAge"></p>
      <span class="badge-mode" id="modeBadge" hidden data-i18n="localBadge"></span>
      <div class="scroll-hint" aria-hidden="true"><span data-i18n="scrollDown"></span> <b>↓</b></div>
    </header>

    <nav class="tabs" id="tabs">
      <a href="#timeline" data-view="timeline" data-i18n="tabTimeline"></a>
      <a href="#growth" data-view="growth" data-i18n="tabGrowth"></a>
      <a href="#letters" data-view="letters" data-i18n="tabLetters"></a>
    </nav>

    <!-- ===== Timeline ===== -->
    <main class="view" id="viewTimeline">
      <section class="on-this-day" id="onThisDay" hidden></section>
      <div class="jumpbar" id="jumpbar" hidden></div>
      <div class="timeline-tools"><button class="btn btn-ghost" id="btnSlideshow" hidden>▶️ <span data-i18n="slideshow"></span></button></div>
      <div class="filters" id="filters" hidden></div>
      <div class="timeline" id="timeline">
        <div class="timeline-line" aria-hidden="true"><div class="timeline-line-fill" id="lineFill"></div></div>
        <div id="events"></div>
      </div>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-emoji">🐣</div>
        <h2 data-i18n="emptyTitle"></h2>
        <p id="emptyText"></p>
        <button class="btn btn-ghost" id="btnSample" hidden data-i18n="sampleBtn"></button>
      </div>
    </main>

    <!-- ===== Growth ===== -->
    <main class="view" id="viewGrowth" hidden>
      <div class="view-head">
        <h2 data-i18n="growthTitle"></h2>
        <button class="btn btn-primary" id="btnAddMeasurement" hidden data-i18n="addMeasurement"></button>
      </div>
      <div id="growthBody"></div>
    </main>

    <!-- ===== Letters ===== -->
    <main class="view" id="viewLetters" hidden>
      <div class="view-head">
        <h2 data-i18n="lettersTitle"></h2>
        <button class="btn btn-primary" id="btnWriteLetter" data-i18n="writeLetter"></button>
      </div>
      <p class="muted view-intro" data-i18n="lettersIntro"></p>
      <div class="letters" id="lettersBody"></div>
    </main>

    <div class="back-top"><button class="btn btn-ghost" id="btnTop">⬆️ <span data-i18n="backToTop"></span></button></div>
    <footer class="footer" id="footer"><span data-i18n="footerA"></span> <span class="heart">♥</span> <span data-i18n="footerB"></span></footer>
  </div>

  <button class="fab" id="fabAdd" hidden>＋ <span data-i18n="addMemory"></span></button>

  <!-- Memory editor -->
  <dialog class="modal" id="eventDialog">
    <form method="dialog" id="eventForm" class="modal-body">
      <h2 id="eventDialogTitle"></h2>
      <div class="row">
        <label class="field grow"><span data-i18n="fTitle"></span>
          <input name="title" required maxlength="120" data-i18n-placeholder="fTitlePh">
        </label>
        <label class="field emoji-field"><span data-i18n="fEmoji"></span>
          <input name="emoji" maxlength="8" placeholder="👣">
        </label>
      </div>
      <div class="row">
        <label class="field grow"><span data-i18n="fDate"></span>
          <input name="date" type="date" required>
          <button type="button" class="link-btn photo-date" id="photoDateHint" hidden></button>
        </label>
        <div class="field grow" id="colorField"><span data-i18n="fColor"></span>
          <div class="swatches" id="colorSwatches"></div>
        </div>
      </div>
      <label class="field"><span data-i18n="fStory"></span>
        <textarea name="description" rows="5" data-i18n-placeholder="fStoryPh"></textarea>
      </label>
      <div class="field" id="tagField"><span data-i18n="fTags"></span>
        <div class="tag-picker" id="tagPicker"></div>
        <input id="tagCustom" maxlength="30" data-i18n-placeholder="fTagCustomPh">
      </div>

      <div class="field"><span data-i18n="fMedia"></span>
        <div class="media-edit" id="mediaEdit"></div>
        <div class="media-add">
          <label class="btn btn-ghost file-btn"><span data-i18n="addMedia"></span>
            <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>
          </label>
          <div class="link-add">
            <input type="url" id="linkInput" data-i18n-placeholder="linkPh">
            <button type="button" class="btn btn-ghost" id="btnAddLink" data-i18n="addLink"></button>
          </div>
        </div>
      </div>

      <label class="field check" id="visibleRow"><input type="checkbox" name="published"> <span data-i18n="fVisible"></span></label>
      <p class="form-error" id="eventError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btnDelete" hidden data-i18n="deleteBtn"></button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" id="btnSave" data-i18n="saveMemory"></button>
      </div>
    </form>
  </dialog>

  <!-- Bulk upload -->
  <dialog class="modal" id="bulkDialog">
    <form method="dialog" id="bulkForm" class="modal-body">
      <h2 data-i18n="bulkTitle"></h2>
      <p class="muted" data-i18n="bulkIntro"></p>
      <div class="row">
        <label class="btn btn-ghost file-btn"><span data-i18n="bulkPick"></span>
          <input type="file" id="bulkInput" accept="image/*,video/*,.heic,.heif" multiple hidden>
        </label>
        <label class="btn btn-ghost file-btn" id="bulkFolderBtn"><span data-i18n="bulkFolder"></span>
          <input type="file" id="bulkFolder" webkitdirectory multiple hidden>
        </label>
      </div>
      <div class="segmented" id="bulkMode">
        <label><input type="radio" name="bulkMode" value="day" checked> <span data-i18n="bulkPerDay"></span></label>
        <label><input type="radio" name="bulkMode" value="photo"> <span data-i18n="bulkPerPhoto"></span></label>
      </div>
      <label class="field check"><input type="checkbox" name="asDraft" checked> <span data-i18n="bulkAsDraft"></span></label>
      <div class="bulk-groups" id="bulkGroups"></div>
      <p class="form-error" id="bulkError" hidden></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" id="btnBulkSave" disabled></button>
      </div>
    </form>
  </dialog>

  <!-- Slideshow -->
  <dialog class="modal" id="slideDialog">
    <form method="dialog" id="slideForm" class="modal-body narrow">
      <h2 data-i18n="slideTitle"></h2>
      <p class="muted" data-i18n="slideIntro"></p>
      <div class="row">
        <label class="field grow"><span data-i18n="slideFrom"></span> <input name="from" type="date"></label>
        <label class="field grow"><span data-i18n="slideTo"></span> <input name="to" type="date"></label>
      </div>
      <div class="field"><span data-i18n="slideSpeed"></span>
        <div class="segmented">
          <label><input type="radio" name="speed" value="slow"> <span data-i18n="speed_slow"></span></label>
          <label><input type="radio" name="speed" value="normal" checked> <span data-i18n="speed_normal"></span></label>
          <label><input type="radio" name="speed" value="fast"> <span data-i18n="speed_fast"></span></label>
        </div>
      </div>
      <label class="field check"><input type="checkbox" name="loop"> <span data-i18n="slideLoop"></span></label>
      <label class="field check"><input type="checkbox" name="music" checked> <span data-i18n="slideMusic"></span></label>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="slideStart"></button>
      </div>
    </form>
  </dialog>

  <!-- Crop the profile photo -->
  <dialog class="modal" id="cropDialog">
    <div class="modal-body narrow">
      <h2 data-i18n="cropTitle"></h2>
      <p class="muted" data-i18n="cropHint"></p>
      <div class="crop-stage" id="cropStage"></div>
      <label class="volume">➖ <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" data-i18n-title="cropZoom"> ➕</label>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="button" class="btn btn-primary" id="btnCropDone" data-i18n="useThisPhoto"></button>
      </div>
    </div>
  </dialog>

  <!-- Family (admin) -->
  <dialog class="modal" id="familyDialog">
    <div class="modal-body">
      <h2 data-i18n="familyTitle"></h2>
      <div id="familyBody"></div>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="close"></button>
      </div>
    </div>
  </dialog>

  <!-- Sign up from an invite link -->
  <dialog class="modal" id="signupDialog">
    <form method="dialog" id="signupForm" class="modal-body narrow">
      <h2 id="signupHello"></h2>
      <p class="muted" data-i18n="inviteIntro"></p>
      <label class="field"><span data-i18n="nameLabel"></span> <input name="name" required maxlength="40"></label>
      <label class="field"><span data-i18n="email"></span> <input name="email" type="email" required autocomplete="username"></label>
      <label class="field"><span data-i18n="newPassword"></span> <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="field"><span data-i18n="newPassword2"></span> <input name="password2" type="password" required minlength="8" autocomplete="new-password"></label>
      <p class="form-error" id="signupError" hidden></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="inviteJoin"></button>
      </div>
    </form>
  </dialog>

  <!-- Measurement editor -->
  <dialog class="modal" id="measureDialog">
    <form method="dialog" id="measureForm" class="modal-body narrow">
      <h2 id="measureDialogTitle"></h2>
      <label class="field"><span data-i18n="fDate"></span> <input name="date" type="date" required></label>
      <div class="row">
        <label class="field grow"><span data-i18n="mHeight"></span> <input name="height_cm" type="number" step="0.1" min="20" max="250" inputmode="decimal"></label>
        <label class="field grow"><span data-i18n="mWeight"></span> <input name="weight_kg" type="number" step="0.01" min="0.5" max="200" inputmode="decimal"></label>
      </div>
      <label class="field"><span data-i18n="mNote"></span> <input name="note" maxlength="120" data-i18n-placeholder="mNotePh"></label>
      <p class="form-error" id="measureError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btnDeleteMeasure" hidden data-i18n="deleteBtn"></button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Letter editor -->
  <dialog class="modal" id="letterDialog">
    <form method="dialog" id="letterForm" class="modal-body">
      <h2 id="letterDialogTitle"></h2>
      <label class="field"><span data-i18n="fTitle"></span> <input name="title" maxlength="120" data-i18n-placeholder="lTitlePh"></label>
      <label class="field"><span data-i18n="lBody"></span> <textarea name="body" rows="10" required data-i18n-placeholder="lBodyPh"></textarea></label>
      <div class="row">
        <label class="field grow"><span data-i18n="lFrom"></span> <input name="author_name" required maxlength="60"></label>
        <label class="field grow"><span data-i18n="lUnlock"></span> <input name="unlock_on" type="date">
          <small class="muted" data-i18n="lUnlockHint"></small></label>
      </div>
      <p class="form-error" id="letterError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btnDeleteLetter" hidden data-i18n="deleteBtn"></button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="saveLetter"></button>
      </div>
    </form>
  </dialog>

  <!-- "What should we call you?" -->
  <dialog class="modal" id="nameDialog">
    <form method="dialog" id="nameForm" class="modal-body narrow">
      <h2 data-i18n="nameTitle"></h2>
      <p class="muted" data-i18n="nameHint"></p>
      <label class="field"><span data-i18n="nameLabel"></span> <input name="name" required maxlength="40"></label>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Notify family -->
  <dialog class="modal" id="notifyDialog">
    <div class="modal-body narrow">
      <h2 data-i18n="notifyTitle"></h2>
      <p class="muted" data-i18n="notifyText"></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="notifySkip"></button>
        <a class="btn btn-primary" id="notifyLink" data-i18n="notifyBtn"></a>
      </div>
    </div>
  </dialog>

  <!-- Settings -->
  <dialog class="modal" id="settingsDialog">
    <form method="dialog" id="settingsForm" class="modal-body">
      <h2 data-i18n="aboutHer"></h2>
      <div class="photo-row">
        <div class="avatar-preview" id="avatarPreview"></div>
        <div class="photo-actions">
          <label class="btn btn-ghost file-btn"><span data-i18n="choosePhoto"></span>
            <input type="file" id="photoInput" accept="image/*,.heic,.heif" hidden>
          </label>
          <button type="button" class="link-btn danger" id="btnRemovePhoto" data-i18n="removePhoto"></button>
          <div class="field"><span data-i18n="decoration"></span><div class="frame-picker" id="framePicker"></div></div>
        </div>
      </div>
      <div class="row">
        <label class="field grow"><span data-i18n="sName"></span>
          <input name="name" required placeholder="Minh Tuệ">
        </label>
        <label class="field emoji-field"><span data-i18n="fEmoji"></span>
          <input name="emoji" maxlength="8" placeholder="🌷">
        </label>
      </div>
      <label class="field"><span data-i18n="sBirthday"></span> <input name="birthday" type="date"></label>
      <label class="field"><span data-i18n="sTagline"></span> <input name="tagline" data-i18n-placeholder="defaultTagline"></label>
      <label class="field check"><input type="checkbox" name="newestFirst"> <span data-i18n="sNewestFirst"></span></label>
      <label class="field check"><input type="checkbox" name="cuteCursor"> <span data-i18n="sCuteCursor"></span></label>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Sign in -->
  <dialog class="modal" id="loginDialog">
    <form method="dialog" id="loginForm" class="modal-body narrow">
      <h2 data-i18n="loginTitle"></h2>
      <p class="muted" data-i18n="loginText"></p>
      <label class="field"><span data-i18n="email"></span> <input name="email" type="email" required autocomplete="username"></label>
      <label class="field"><span data-i18n="password"></span> <input name="password" type="password" required autocomplete="current-password"></label>
      <p class="form-error" id="loginError" hidden></p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" id="btnLoginSubmit" data-i18n="signIn"></button>
      </div>
    </form>
  </dialog>

  <!-- Backup -->
  <dialog class="modal" id="backupDialog">
    <div class="modal-body narrow">
      <h2 data-i18n="backupTitle"></h2>
      <p class="muted" id="backupText"></p>
      <div class="stack">
        <button class="btn btn-primary" id="btnExport" data-i18n="downloadBackup"></button>
        <label class="btn btn-ghost file-btn" id="restoreLabel"><span data-i18n="restoreBackup"></span>
          <input type="file" id="importInput" accept="application/json,.json" hidden>
        </label>
      </div>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close data-i18n="close"></button>
      </div>
    </div>
  </dialog>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-nav lb-next" aria-label="Next">›</button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
